# Beam+ robot settings
# Edit this file on any computer (it's on the USB stick's BEAMCONFIG drive),
# then plug the stick into the robot and boot it.
#
# Passwords and keys are moved into the robot on boot, then replaced here
# with "(saved on robot)". To change one, just type the new value.

# --- Wi-Fi ---------------------------------------------------------------
WIFI_SSID=
WIFI_PASSWORD=

# --- Tailscale (drive from anywhere, with HTTPS so Talk works) -----------
# Optional: an auth key from https://login.tailscale.com/admin/settings/keys
# Leave empty and the robot's screen shows a login link on first boot instead.
TAILSCALE_AUTHKEY=

# --- Robot ----------------------------------------------------------------
# Name on your tailnet: https://<ROBOT_NAME>.<your-tailnet>.ts.net/
ROBOT_NAME=beam
# Top speed in m/s, with a dot (the board's own limit is 1.0; not understood = 0.3)
MAX_SPEED=0.6
# Optional extra lock: pages then need ?token=<ACCESS_TOKEN> in the URL
# (8 to 128 letters, digits, - or _; anything else locks the robot until fixed)
ACCESS_TOKEN=
# yes = also serve plain http://<robot-ip>:8080 on the home network
# (no Talk there, and anyone on your Wi-Fi could drive unless ACCESS_TOKEN is set)
LAN_ACCESS=no
# Your time zone, e.g. America/Vancouver or Europe/Berlin (empty = UTC)
TIMEZONE=
# Sleep every night: cameras, microphone, screen off; wake it from the driving
# page any time, and it wakes by itself at the end. e.g. 23:00-07:00 (empty = never)
SLEEP_HOURS=

# --- Sensors (optional) ----------------------------------------------------
# Which USB port is the lidar / the ultrasonic distance sensor. Empty = auto:
# the robot tries each USB serial adapter of the right kind and uses the one
# that answers like the sensor. Pin them when something else uses the same
# chip (a robot arm, say), so it's never even tried: a name from
# /dev/serial/by-id/ on the robot (e.g. usb-Silicon_Labs_CP2102N_..._if00-port0).
# none = not fitted. Several distance sensors: names separated by commas,
# each with @degrees for the way it faces (e.g. NAME_A@-30,NAME_B,NAME_C@30).
LIDAR_DEVICE=
RANGE_DEVICE=
# The 8x8 matrix distance sensor on its own USB-C port: empty = auto (an RP2040
# sending its frames), none = not fitted. Where it is: lens height above the
# floor (cm, default 10), how far it points down (degrees, default 0; negative
# = up), and MATRIX_FLIP=x if left and right come out swapped (y: upside down).
MATRIX_DEVICE=
MATRIX_HEIGHT_CM=
MATRIX_TILT_DEG=
MATRIX_FLIP=

# The obstacle stop (forward driving only; backing away and turning are never
# limited): the base at its widest, measured (cm, default 31, a Beam+: its path
# is half that plus 2.5 cm either side of the centre line), where the lidar sits
# off that centre line (cm, + to the right, default 0), stop at this gap ahead
# (cm, default 15), and start slowing down from this gap (cm, default 60).
ROBOT_WIDTH_CM=
LIDAR_SIDE_CM=
OBSTACLE_STOP_CM=
OBSTACLE_SLOW_CM=

# --- Brain (experimental: face recognition and greetings) -------------------
# A shared key that lets the brain (running on another computer, e.g. your
# Proxmox VM) connect and see the cameras. Empty = brain disabled.
# Use the same key on the brain host (see brain-host/install.sh).
BRAIN_KEY=

# --- Maintenance -----------------------------------------------------------
# SSH public keys allowed to log in as user "beam" (one SSH_KEY= line each).
# Delete a line to revoke it. Password logins are disabled.
SSH_KEY=
